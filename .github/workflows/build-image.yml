name: build-image

on:
  workflow_dispatch:
  push:
    paths:
      - "docker/centos7-build/Dockerfile"
      - "docker/centos7-build/build_inside.sh"
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: docker/centos7-build
          file: docker/centos7-build/Dockerfile
          push: true
          tags: ghcr.io/degeneracy-evil/sysal/sysal-centos7-build:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
