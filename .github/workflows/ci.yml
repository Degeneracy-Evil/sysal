name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang clang-format clang-tidy

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-install
          package-cache: true

      - name: Configure
        run: xmake f -c -y --toolchain=clang

      - name: Run quality checks
        run: xmake check

      - name: Verify quality checks did not modify tracked files
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: Run sysal_info
        run: xmake run sysal_info
