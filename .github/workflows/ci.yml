name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: build-essential clang clang-format clang-tidy lld libc++-dev libc++abi-dev
          version: 1.0

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: .xmake-install
          package-cache: true

      - name: Configure
        run: xmake f -c -y --toolchain=clang

      - name: Run quality checks
        run: xmake check

      - name: Run sysal_info
        run: xmake run sysal_info
